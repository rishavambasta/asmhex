name: Build and Release

on:
  push:
    branches: [ master, main, win64 ]
    tags:
      - 'v*'
  pull_request:
    branches: [ master, main, win64 ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    name: Build & Test (Linux x86_64 & Windows x64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm gcc gcc-mingw-w64-x86-64 mingw-w64 libx11-dev libxext-dev xvfb wine zip

      - name: Compile Linux and Windows 64-bit Binaries
        run: |
          make clean
          make -j$(nproc)
          make win64

      - name: Run 30-Point Linux Automated Test Suite
        run: xvfb-run --auto-servernum make test

      - name: Run Windows 64-bit Automated Test Suite under Wine
        env:
          WINEDEBUG: -all
        run: xvfb-run --auto-servernum make test-win64

      - name: Run Live Resizing Verification
        run: |
          gcc -O2 tests/test_resize_live.c build/renderer.o build/file_io.o build/editor.o build/x11_shm.o build/hash.o -no-pie -lX11 -lXext -o build/test_resize_live
          xvfb-run --auto-servernum ./build/test_resize_live

      - name: Run Performance & Throughput Benchmark
        run: xvfb-run --auto-servernum make benchmark

      - name: Package Release Distribution
        run: |
          mkdir -p dist/asmhex-linux dist/asmhex-win64
          cp asmhex README.md LICENSE font.bin dist/asmhex-linux/
          tar -czvf dist/asmhex-linux-x86_64.tar.gz -C dist/asmhex-linux .
          cp asmhex.exe README.md LICENSE font.bin dist/asmhex-win64/
          cd dist/asmhex-win64 && zip -r ../asmhex-windows-x86_64.zip . && cd ../..
          cp asmhex dist/asmhex
          cp asmhex.exe dist/asmhex.exe
          cd dist
          sha256sum asmhex asmhex.exe asmhex-linux-x86_64.tar.gz asmhex-windows-x86_64.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: asmhex-binaries
          path: |
            dist/asmhex
            dist/asmhex.exe
            dist/asmhex-linux-x86_64.tar.gz
            dist/asmhex-windows-x86_64.zip
            dist/SHA256SUMS.txt

  release:
    name: Publish GitHub Release
    needs: build-and-test
    if: (github.event_name == 'push') && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/win64' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Built Artifacts
        uses: actions/download-artifact@v4
        with:
          name: asmhex-binaries
          path: dist

      - name: Determine Release Tag
        id: vars
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
            echo "release_name=AsmHex ${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == 'refs/heads/win64' ]]; then
            echo "tag=win64-preview" >> $GITHUB_OUTPUT
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
            echo "release_name=AsmHex Windows 64-bit Preview" >> $GITHUB_OUTPUT
          else
            echo "tag=latest" >> $GITHUB_OUTPUT
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
            echo "release_name=AsmHex Latest Continuous Release" >> $GITHUB_OUTPUT
          fi

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: ${{ steps.vars.outputs.release_name }}
          draft: false
          prerelease: ${{ steps.vars.outputs.is_prerelease == 'true' }}
          generate_release_notes: true
          files: |
            dist/asmhex
            dist/asmhex.exe
            dist/asmhex-linux-x86_64.tar.gz
            dist/asmhex-windows-x86_64.zip
            dist/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
