name: Build and Release

on:
  push:
    branches: [ master, main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    name: Build & Test (x86_64 Pure Assembly)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm gcc libx11-dev libxext-dev xvfb

      - name: Compile AsmHex Binary
        run: make clean && make

      - name: Run 24-Point Automated Test Suite
        run: xvfb-run --auto-servernum make test

      - name: Run Live Resizing Verification
        run: |
          gcc -O2 tests/test_resize_live.c build/renderer.o build/file_io.o build/editor.o build/x11_shm.o build/hash.o -no-pie -lX11 -lXext -o build/test_resize_live
          xvfb-run --auto-servernum ./build/test_resize_live

      - name: Run Performance & Throughput Benchmark
        run: xvfb-run --auto-servernum make benchmark

      - name: Package Release Distribution
        run: |
          mkdir -p dist/asmhex-dist
          cp asmhex README.md LICENSE font.bin dist/asmhex-dist/
          tar -czvf dist/asmhex-linux-x86_64.tar.gz -C dist/asmhex-dist .
          cp asmhex dist/asmhex
          cd dist
          sha256sum asmhex asmhex-linux-x86_64.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: asmhex-binaries
          path: |
            dist/asmhex
            dist/asmhex-linux-x86_64.tar.gz
            dist/SHA256SUMS.txt

  release:
    name: Publish GitHub Release
    needs: build-and-test
    if: (github.event_name == 'push') && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Built Artifacts
        uses: actions/download-artifact@v4
        with:
          name: asmhex-binaries
          path: dist

      - name: Determine Release Tag
        id: vars
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
            echo "release_name=AsmHex ${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "tag=latest" >> $GITHUB_OUTPUT
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
            echo "release_name=AsmHex Latest Continuous Release" >> $GITHUB_OUTPUT
          fi

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: ${{ steps.vars.outputs.release_name }}
          draft: false
          prerelease: ${{ steps.vars.outputs.is_prerelease == 'true' }}
          generate_release_notes: true
          files: |
            dist/asmhex
            dist/asmhex-linux-x86_64.tar.gz
            dist/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
